name: Build CircleSidebar APK

on:
  push:
    paths:
      - 'CircleSidebar_AndroidForge.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q CircleSidebar_AndroidForge.zip -d extracted

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          ROOT=$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "No settings.gradle found."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 6 -type f | sort | head -500
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle root: $ROOT"
          echo "===== settings.gradle ====="
          cat "$ROOT/settings.gradle"
          echo "===== build.gradle ====="
          cat "$ROOT/build.gradle"
          echo "===== app/build.gradle ====="
          cat "$ROOT/app/build.gradle"

      - name: Remove corrupted duplicate AppCompat resources
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          find app/src/main/res -type f \( -iname 'abc_*.xml' -o -iname 'abc_*.png' \) -print -delete

      - name: Decode compiled Android XML resources
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          python3 -m pip install --quiet axml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          import os

          decoded = 0
          failed = []
          for p in Path("app/src/main").rglob("*.xml"):
              data = p.read_bytes()
              if len(data) >= 4 and data[:4] == bytes.fromhex("03000800"):
                  with tempfile.NamedTemporaryFile(delete=False) as out:
                      tmp = out.name
                  try:
                      r = subprocess.run(["axml", "-i", str(p)], capture_output=True, text=True)
                      if r.returncode == 0 and Path(tmp).exists() and Path(tmp).stat().st_size > 0:
                          p.write_bytes(Path(tmp).read_bytes())
                          decoded += 1
                          print("Decoded AXML:", p)
                      else:
                          failed.append((str(p), r.stderr[-500:]))
                  finally:
                      try: os.unlink(tmp)
                      except FileNotFoundError: pass

          print("AXML files decoded:", decoded)
          if failed:
              print("AXML decode failures:")
              for item in failed:
                  print(item)
              raise SystemExit(1)
          PY

      - name: Resolve decoded resource IDs
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          mapping = {}
          for p in Path("app/src/main/res").glob("values*/public.xml"):
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  continue
              for e in root.findall("public"):
                  rid = e.get("id", "")
                  if rid.lower().startswith("0x"):
                      mapping[rid[2:].upper()] = f"{e.get('type')}/{e.get('name')}"

          print("Resource IDs available:", len(mapping))

          pat = re.compile(r"([@?])\\*?(?:0x)?([0-9A-Fa-f]{8})")
          changed = 0
          for p in Path("app/src/main/res").rglob("*.xml"):
              s = p.read_text(encoding="utf-8", errors="ignore")
              def repl(m):
                  prefix, rid = m.group(1), m.group(2).upper()
                  name = mapping.get(rid)
                  if not name:
                      return m.group(0)
                  return prefix + name
              ns = pat.sub(repl, s)
              if ns != s:
                  p.write_text(ns, encoding="utf-8")
                  changed += 1
          print("XML files with resolved resource references:", changed)
          PY

      - name: Repair malformed XML resource encoding
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          bad = []
          for p in Path("app/src/main/res").rglob("*.xml"):
              raw = p.read_bytes()
              try:
                  ET.fromstring(raw)
                  continue
              except Exception:
                  pass

              text = raw.decode("utf-8", errors="ignore")
              first = text.find("<")
              if first >= 0:
                  text = text[first:]
              text = "".join(ch for ch in text if ch in "\\t\\n\\r" or ord(ch) >= 32)

              try:
                  ET.fromstring(text.encode("utf-8"))
              except Exception as e:
                  bad.append((str(p), repr(e), raw[:64].hex()))
                  continue

              p.write_bytes(text.encode("utf-8"))
              print("Repaired:", p)

          if bad:
              print("Unrepairable XML resources:")
              for item in bad:
                  print(item)
              raise SystemExit(1)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build existing project
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find "${{ steps.locate.outputs.root }}" -type f -name '*.apk' -print -exec cp {} apk-output/ \;
          if [ -z "$(find apk-output -type f -name '*.apk' -print -quit)" ]; then
            echo "No APK was produced."
            exit 1
          fi
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSidebar-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
