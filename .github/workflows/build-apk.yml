name: Build CircleSidebar APK

on:
  push:
    paths:
      - 'CircleSidebar_AndroidForge.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q CircleSidebar_AndroidForge.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -200

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          ROOT=$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "No gradlew found. Project contents:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | sort | head -500
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle root: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build existing project
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find "${{ steps.locate.outputs.root }}" -type f -name '*.apk' -print -exec cp {} apk-output/ \;
          if [ -z "$(find apk-output -type f -name '*.apk' -print -quit)" ]; then
            echo "No APK was produced."
            exit 1
          fi
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSidebar-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
