name: Build CircleSidebar APK

on:
  push:
    paths:
      - 'CircleSidebar_AndroidForge.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q CircleSidebar_AndroidForge.zip -d extracted

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          ROOT=$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "No settings.gradle found."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle root: $ROOT"
          cat "$ROOT/settings.gradle"
          cat "$ROOT/build.gradle"
          cat "$ROOT/app/build.gradle"

      - name: Remove duplicate AppCompat resources
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          find app/src/main/res -type f \( -iname 'abc_*.xml' -o -iname 'abc_*.png' \) -delete

      - name: Decode compiled Android XML resources
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          python3 -m pip install --quiet axml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          import os
          import xml.etree.ElementTree as ET

          paths = list(Path("app/src/main/res").rglob("*.xml"))
          manifest = Path("app/src/main/AndroidManifest.xml")
          if manifest.exists():
              paths.append(manifest)

          failed = []
          decoded = 0

          for p in paths:
              data = p.read_bytes()
              if data[:4] != bytes.fromhex("03000800"):
                  continue

              with tempfile.NamedTemporaryFile(delete=False) as out:
                  tmp = out.name

              try:
                  r = subprocess.run(["axml", "-i", str(p)], capture_output=True, text=True)
                  if "<" not in r.stdout or ">" not in r.stdout:
                      failed.append((str(p), "axml command failed: " + r.stderr[-300:]))
                      continue

                  xml_text = r.stdout[r.stdout.find("<"):r.stdout.rfind(">") + 1]
                  ET.fromstring(xml_text.encode("utf-8"))
                  p.write_text(xml_text, encoding="utf-8")
                  decoded += 1
              except Exception as e:
                  failed.append((str(p), "parse/write failure: " + repr(e) + " | output_head=" + repr(r.stdout[:1000])))
              finally:
                  try:
                      os.unlink(tmp)
                  except FileNotFoundError:
                      pass

          print("Decoded AXML files:", decoded)
          if failed:
              print("AXML decode failures:")
              for item in failed:
                  print(item)
              raise SystemExit(1)
          PY

      - name: Normalize resource references
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          mapping = {}
          for p in Path("app/src/main/res").glob("values*/public.xml"):
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  continue
              for e in root.findall("public"):
                  rid = e.get("id", "")
                  if rid.lower().startswith("0x"):
                      mapping[rid[2:].upper()] = f"{e.get('type')}/{e.get('name')}"

          print("Public resource IDs:", len(mapping))
          pat = re.compile(r"([@?])(\\*?)(?:0x)?([0-9A-Fa-f]{8})")

          for p in Path("app/src/main/res").rglob("*.xml"):
              s = p.read_text(encoding="utf-8", errors="ignore")
              def repl(m):
                  prefix, star, rid = m.group(1), m.group(2), m.group(3).upper()
                  name = mapping.get(rid)
                  if name:
                      return prefix + star + name
                  return prefix + star + "0x" + rid.lower()
              ns = pat.sub(repl, s)
              if ns != s:
                  p.write_text(ns, encoding="utf-8")
          PY

      - name: Validate XML resources
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          bad = []
          for p in Path("app/src/main/res").rglob("*.xml"):
              try:
                  ET.parse(p)
              except Exception as e:
                  bad.append((str(p), repr(e)))
          if bad:
              for x in bad:
                  print(x)
              raise SystemExit(1)
          print("All source XML resources parse successfully.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build existing project
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find "${{ steps.locate.outputs.root }}" -type f -name '*.apk' -print -exec cp {} apk-output/ \;
          test -n "$(find apk-output -type f -name '*.apk' -print -quit)"
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSidebar-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
